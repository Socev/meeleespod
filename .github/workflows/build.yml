name: build
# meeleespod: toetsen → image bouwen → rooktest in dezelfde vorm als de chart (alleen-lezen rootfs, uid 1000, geen inlog,
# nep-sleutels) → pas dan pushen naar ghcr (tag <run> en stabiel-<run>; de chart wijst een vaste stabiel-<run> aan).
on:
  push:
    branches: [ main ]
    paths-ignore: [ "chart/**", "**.md" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toetsen (vangnet, API, inlogpagina, lezers, bijlagen, Parro droog)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install -q pytest==9.1.1
          grep -A1 '^pypdf==' requirements.txt > /tmp/pypdf.txt
          pip install -q --no-deps --require-hashes --only-binary=:all: -r /tmp/pypdf.txt
          python -m pytest -q tests

      - name: Vendor = nagelezen code (vaste commits, wv1435)
        run: bash ci/vendor_toets.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Vanger bouwen + bundel zonder verzendroutes
        run: |
          cd vanger && npm ci --ignore-scripts --no-audit --no-fund && npx tsc -p tsconfig.json && cd ..
          bash ci/bundel_grep.sh vanger/dist meeleespod

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/socev/meeleespod:${{ github.run_number }}

      - name: Rooktest zonder inlog
        run: bash ci/rooktest.sh ghcr.io/socev/meeleespod:${{ github.run_number }}

      - name: Rooktest opruimen
        if: always()
        run: docker rm -f meelees-rook 2>/dev/null || true

      - name: Pushen (alleen na geslaagde toetsen)
        run: |
          set -euo pipefail
          I=ghcr.io/socev/meeleespod
          docker tag $I:${{ github.run_number }} $I:stabiel-${{ github.run_number }}
          docker push $I:${{ github.run_number }}
          docker push $I:stabiel-${{ github.run_number }}
